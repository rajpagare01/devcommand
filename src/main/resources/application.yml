spring:
  application:
    name: devcommand
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:dummy-openai-key}
    google:
      genai:
        api-key: ${GEMINI_API_KEY:dummy-gemini-key}
    model:
      chat: none
      audio:
        speech: none
        transcription: none
      embedding: none
      image: none
      moderation: none

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 900000
      pool-name: DevCommandHikariPool

  flyway:
    enabled: true
    baseline-on-migrate: false

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        generate_statistics: false
        jdbc:
          batch_size: 20
        query:
          plan_cache_max_size: 64
    open-in-view: false

server:
  port: ${PORT:8080}
  tomcat:
    threads:
      max: 15
      min-spare: 2
    max-connections: 50
    accept-count: 20

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
  endpoint:
    health:
      show-details: when_authorized
    metrics:
      enabled: true

devcommand:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081,https://dev-command-ecru.vercel.app}

leetcode:
  enabled: ${LEETCODE_ENABLED:true}
  base-url: ${LEETCODE_BASE_URL:https://leetcode.com}
  timeout-seconds: ${LEETCODE_TIMEOUT_SECONDS:10}


telegram:
  bot-token: ${TELEGRAM_BOT_TOKEN:}
  allowed-user-id: ${TELEGRAM_ALLOWED_USER_ID:0}

gemini:
  api-key: ${GEMINI_API_KEY:}
  api-url: ${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/}
  model: ${GEMINI_MODEL:gemini-1.5-flash}
  timeout-seconds: ${GEMINI_TIMEOUT_SECONDS:30}
  max-retries: ${GEMINI_MAX_RETRIES:2}

ai:
  primary-provider: ${AI_PRIMARY_PROVIDER:gemini}
  fallback-provider: ${AI_FALLBACK_PROVIDER:groq}
  groq:
    enabled: ${GROQ_ENABLED:true}
    api-key: ${GROQ_API_KEY:}
    api-url: ${GROQ_API_URL:https://api.groq.com/openai/v1/chat/completions}
    model: ${GROQ_MODEL:llama-3.3-70b-versatile}
    timeout-seconds: ${GROQ_TIMEOUT_SECONDS:30}
    max-retries: ${GROQ_MAX_RETRIES:2}

---
spring:
  config:
    activate:
      on-profile: "dev"
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/devcommand}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres_password_example}
  devtools:
    restart:
      enabled: true

devcommand:
  jwt:
    secret: ${JWT_SECRET:change-this-in-production-to-a-long-random-base64-secret-value}
