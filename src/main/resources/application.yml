spring:
  application:
    name: devcommand

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    baseline-on-migrate: false

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
  endpoint:
    health:
      show-details: when_authorized
    metrics:
      enabled: true

devcommand:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081}

leetcode:
  enabled: ${LEETCODE_ENABLED:false}
  base-url: ${LEETCODE_BASE_URL:https://leetcode.com}
  timeout-seconds: ${LEETCODE_TIMEOUT_SECONDS:10}


---
spring:
  config:
    activate:
      on-profile: "dev"
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/devcommand}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres_password_example}
  devtools:
    restart:
      enabled: true

devcommand:
  jwt:
    secret: ${JWT_SECRET:change-this-in-production-to-a-long-random-base64-secret-value}

twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:}
  auth-token: ${TWILIO_AUTH_TOKEN:}
  whatsapp-number: ${TWILIO_WHATSAPP_NUMBER:}
  content-sid: ${TWILIO_CONTENT_SID:}

telegram:
  bot-token: ${TELEGRAM_BOT_TOKEN}
  allowed-user-id: ${TELEGRAM_ALLOWED_USER_ID}

gemini:
  api-key: ${GEMINI_API_KEY}
  api-url: ${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/}
  model: ${GEMINI_MODEL:gemini-3.8-flash}
  timeout-seconds: ${GEMINI_TIMEOUT_SECONDS:30}
  max-retries: ${GEMINI_MAX_RETRIES:2}

ai:
  primary-provider: ${AI_PRIMARY_PROVIDER:gemini}
  fallback-provider: ${AI_FALLBACK_PROVIDER:groq}
  groq:
    enabled: ${GROQ_ENABLED:true}
    api-key: ${GROQ_API_KEY}
    api-url: ${GROQ_API_URL:https://api.groq.com/openai/v1/chat/completions}
    model: ${GROQ_MODEL:llama3-70b-8192}
    timeout-seconds: ${GROQ_TIMEOUT_SECONDS:30}
    max-retries: ${GROQ_MAX_RETRIES:2}

leetcode:
  enabled: ${LEETCODE_ENABLED:true}

