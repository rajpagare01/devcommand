spring:
  main:
    allow-bean-definition-overriding: true
  autoconfigure:
    exclude:
      - org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration
  ai:
    openai:
      api-key: dummy-openai-key
    google:
      genai:
        api-key: dummy-gemini-key
    model:
      chat: none
      audio:
        speech: none
        transcription: none
      embedding: none
      image: none
      moderation: none
    vectorstore:
      pgvector:
        initialize-schema: false
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/devcommand_test?sslmode=disable}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:${POSTGRES_PASSWORD:}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

devcommand:
  jwt:
    secret: change-this-test-secret-key-that-is-long-enough-for-hs256
    expiration-ms: 3600000


telegram:
  bot-token: test-bot-token
  allowed-user-id: 123456

gemini:
  api-key: test-api-key
  api-url: https://generativelanguage.googleapis.com/v1beta/models/
  model: gemini-1.5-flash
  timeout-seconds: 30
  max-retries: 2

ai:
  primary-provider: gemini
  fallback-provider: groq
  groq:
    enabled: true
    api-key: test-groq-key
    api-url: https://api.groq.com/openai/v1/chat/completions
    model: llama3-70b-8192
    timeout-seconds: 30
    max-retries: 2
  rag:
    enabled: true
    top-k: 4
    similarity-threshold: 0.65
    chunk-size: 500
    chunk-overlap: 50
    embedding-provider: test
    dimensions: 1536

leetcode:
  enabled: true
  base-url: https://leetcode.com
  timeout-seconds: 10
